name: Build and push Docker image

on:
  # Manual trigger from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 26.02.27) — leave empty to push only :latest'
        required: false
        default: ''

  # Optional: also trigger automatically on push to main
  # push:
  #   branches:
  #     - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU — enables building arm64 on the amd64 GitHub runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx — multi-platform build driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/extjs-photo-gallery:latest"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/extjs-photo-gallery:${{ github.event.inputs.version }}"
          fi
          echo "value=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.value }}
          # Layer cache — significantly speeds up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
