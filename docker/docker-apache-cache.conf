# Cache-Control headers for static JS and CSS files.
# "no-cache" instructs the browser to always revalidate with the server
# (via ETag / Last-Modified) before serving from cache.
# This ensures that updated files are picked up after a new Docker image
# is deployed, without requiring users to manually clear their browser cache.
<FilesMatch "\.(js|css)$">
    Header set Cache-Control "no-cache, must-revalidate"
</FilesMatch>
